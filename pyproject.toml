[build-system]
requires = ["setuptools>=80", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-score"
dynamic = ["version"]
description = "3D scoring functions used for evaluation of ShEPhERD"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kento Abeywardane", email = "kento@mit.edu"}
]
keywords = [
    "bioinformatics",
    "molecular-modeling",
    "3d-scoring",
    "drug-discovery",
    "chemistry",
    "bioisosteres"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "rdkit>=2023.03",
    "torch>=1.12",
    "open3d>=0.18",
    "py3Dmol",
    "numpy",
    "pandas>=2.0",
    "scipy>=1.10",
    "molscrub",
    "tqdm",
    "numba",            # default CPU backend for the batched aligners; see [cpu] for the SVML build
    "threadpoolctl",    # caps BLAS/OpenMP threads in the multi-GPU worker processes
]

[project.urls]
Homepage = "https://github.com/coleygroup/shepherd-score"
Repository = "https://github.com/coleygroup/shepherd-score"
Documentation = "https://shepherd-score.readthedocs.io"
"Bug Tracker" = "https://github.com/coleygroup/shepherd-score/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.0",
    "sphinx-copybutton>=0.5",
    "myst-nb>=1.0",
]
# SVML-vectorized CPU kernels: llvmlite stopped building in SVML at numba 0.62. icc_rt is
# Intel's runtime; shepherd_score/accel/kernels/_svml.py loads it from the pip install (Linux).
cpu = [
    "numba>=0.59,<0.62",
    "icc_rt; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# GPU kernels need a CUDA build of torch (>= 2.6, for torch.cuda.graph(capture_error_mode=...))
# and Triton >= 3.6 (for @triton.autotune(cache_results=...)).
gpu = [
    "triton>=3.6",
    "torch>=2.6",
]
jax = [
    "jax>=0.4.20; python_version <'3.11'",
    "jaxlib>=0.4.20; python_version <'3.11'",
    "optax>=0.2.0; python_version <'3.11'",
    "jax>=0.9.0; python_version >='3.11'",
    "jaxlib>=0.9.0; python_version >='3.11'",
    "optax>=0.2.6; python_version >='3.11'",
    "scikit-learn>=1.3",
]
docking = [
    "meeko",
    "gemmi",            # imported by meeko, which declares no dependencies on PyPI
    "vina>=1.2.5",
    "openbabel",
    "prolif>=2.0.3",
    "biopython>=1.84",
]
all = [
    "shepherd-score[dev,docs,cpu,gpu,jax,docking]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shepherd_score*"]
exclude = ["tests*", "examples*", "scripts*", "docs*", ".github*"]

[tool.setuptools.package-data]
"shepherd_score" = ["*.yml", "*.yaml", "*.json", "*.txt", "*.fdef", "*.pdbqt"]

[tool.setuptools.data-files]
"share/shepherd-score/skills/design-scoring-mode" = [
    ".claude/skills/design-scoring-mode/pitfalls.md",
    ".claude/skills/design-scoring-mode/seams.md",
    ".claude/skills/design-scoring-mode/SKILL.md",
    ".claude/skills/design-scoring-mode/template_test.py",
]
"share/shepherd-score/skills/accelerate-scoring-mode" = [
    ".claude/skills/accelerate-scoring-mode/kernel_anatomy.md",
    ".claude/skills/accelerate-scoring-mode/parity_gates.md",
    ".claude/skills/accelerate-scoring-mode/screen_wiring.md",
    ".claude/skills/accelerate-scoring-mode/seams.md",
    ".claude/skills/accelerate-scoring-mode/SKILL.md",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
]
ignore = [
    "E501",   # line too long
    "B008",   # function call in default argument
    "SIM108", # ternary operator
    "F401",   # unused imports
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
# Numerical-kernel idioms: one matrix row per line (E702), single-letter math names (E741),
# lambda buffer factories (E731); tests add imports behind pytest.importorskip (E401/E402).
"shepherd_score/accel/**" = ["E702", "E741", "E731"]
"tests/**" = ["E401", "E402", "E702", "E741", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["shepherd_score"]

[tool.setuptools_scm]
version_file = "shepherd_score/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=shepherd_score",
    "--cov-report=term-missing",
]
